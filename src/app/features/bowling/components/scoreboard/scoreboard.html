<div class="max-w-6xl mx-auto p-4">
  <div class="bg-slate-800 rounded-lg shadow-2xl p-6">
    <div class="grid grid-cols-10 gap-1 mb-4">
      @for (frame of game().frames; track $index) {
        <app-scoreboard-frame
          [index]="$index"
          [currentFrameIndex]="game().currentFrameIndex"
          [cumulativeScores]="game().cumulativeScores"
          [firstRoll]="game().frames[$index].firstRoll"
          [secondRoll]="game().frames[$index].secondRoll"
          [thirdRoll]="game().frames[$index].thirdRoll"
          [isSpare]="game().frames[$index].isSpare"
          [isStrike]="game().frames[$index].isStrike"
        ></app-scoreboard-frame>
      }
    </div>

    @if (game().isGameCompleted) {
      <div class="bg-green-600 rounded-md p-4 text-white text-center">
        <p class="text-xl font-bold">
          Game Completed!
        </p>
        <p class="text-3xl font-bold mt-2">
          Final Score: {{ game().finalScore }}
        </p>
      </div>
    }
  </div>
</div>
