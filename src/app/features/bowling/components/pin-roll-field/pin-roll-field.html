@if (!game().isGameCompleted) {
  <form [formGroup]="pinFormGroup" (ngSubmit)="submit()" class="max-w-md mx-auto mt-6">
    <div class="bg-white rounded-lg shadow-lg p-6">
      <label for="pinCount" class="block text-sm font-semibold text-gray-700 mb-2">
        Enter Pins Knocked Down
      </label>

      <div class="flex gap-3">
        <input
          id="pinCount"
          type="number"
          formControlName="pinCount"
          min="0"
          max="10"
          placeholder="0-10"
          class="flex-1 px-4 py-3 text-lg font-semibold border-2 border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all"
          [class.border-red-500]="
            pinFormGroup.controls.pinCount.touched && pinFormGroup.controls.pinCount.invalid
          "
        />

        <app-button [type]="'submit'" [disabled]="pinFormGroup.invalid" (clicked)="submit()">
          Roll
        </app-button>
      </div>

      @if (pinFormGroup.controls.pinCount.touched && pinFormGroup.controls.pinCount.invalid) {
        <div class="mt-3 bg-red-50 border border-red-200 rounded-md p-3">
          <p class="text-red-600 font-semibold text-sm">Invalid value - must be between 0 and 10</p>
        </div>
      }
    </div>
  </form>
}
