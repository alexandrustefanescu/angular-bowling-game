<div
  class="bg-white rounded border-2 transition-all"
  [class.border-green-500]="isCurrentFrame()"
  [class.shadow-lg]="isCurrentFrame()"
  [class.border-gray-300]="!isCurrentFrame()"
>
  <div
    class="bg-gray-100 text-center text-xs font-semibold py-1 border-b border-gray-300"
  >
    {{ index() + 1 }}
  </div>

  <div
    class="grid h-12 border-b border-gray-300"
    [class.grid-cols-2]="!isLastFrame()"
    [class.grid-cols-3]="isLastFrame()"
  >
    <div
      class="flex items-center justify-center text-lg font-bold border-r border-gray-300"
    >
      {{ firstRollDisplay() }}
    </div>
    <div
      class="flex items-center justify-center text-lg font-bold"
      [class.border-r]="isLastFrame()"
      [class.border-gray-300]="isLastFrame()"
    >
      {{ secondRollDisplay() }}
    </div>
    @if (isLastFrame()) {
      <div class="flex items-center justify-center text-lg font-bold">
        {{ thirdRollDisplay() }}
      </div>
    }
  </div>

  <div class="bg-blue-50 text-center py-2 text-xl font-bold text-blue-900">
    {{ score() }}
  </div>
</div>
